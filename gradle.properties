# Gradle daemon tuning for a large multi-module build.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Build performance: run independent module builds in parallel.
org.gradle.parallel=true

# Reuse outputs across builds via the build cache.
org.gradle.caching=true

# Required for Jetpack libraries.
android.useAndroidX=true

# Compile only the R class of the current module (smaller, faster builds).
android.nonTransitiveRClass=true

# Official Kotlin style conventions.
kotlin.code.style=official
